name: ci
# NOTE: this workflow has never been run on GitHub. The commands match what was run locally.
on: [push, pull_request]

env:
  DATABASE_URL: postgresql://triphub:triphub@localhost:5432/triphub
  REDIS_URL: redis://localhost:6379
  # Test-only secrets; CI never uses real credentials.
  MFA_ENCRYPTION_KEY: ci-only-key-0123456789abcdef0123456789abcdef
  SESSION_SECRET: ci-only-session-0123456789abcdef0123456789
  WEB_ORIGIN: http://localhost:3000
  DEV_MAILBOX: "1"

jobs:
  verify:
    name: build, typecheck, unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: triphub, POSTGRES_PASSWORD: triphub, POSTGRES_DB: triphub }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U triphub" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter @triphub/database migrate
      - run: pnpm -r --workspace-concurrency=1 run build
      - run: pnpm -r --workspace-concurrency=1 run typecheck
      - run: pnpm -r --workspace-concurrency=1 run test
      - name: dependency audit (production dependencies, high severity and above)
        run: pnpm audit --prod --audit-level high

  browser:
    name: real-browser tests (Playwright + axe)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: triphub, POSTGRES_PASSWORD: triphub, POSTGRES_DB: triphub }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U triphub" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      E2E_CHANNEL: chromium
      E2E_DATABASE_URL: postgresql://triphub:triphub@localhost:5432/triphub
      NEXT_PUBLIC_MAP_STYLE_URL: http://localhost:3000/map/dev-style.json
      NEXT_PUBLIC_MAP_ORIGIN: https://tile.openstreetmap.org
      E2E_MAP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter @triphub/database migrate
      - run: pnpm -r --workspace-concurrency=1 run build
      - run: pnpm --filter @triphub/api seed
      - run: pnpm --filter @triphub/e2e exec playwright install --with-deps chromium
      - name: start API and web
        run: |
          pnpm --filter @triphub/api start > api.log 2>&1 &
          pnpm --filter @triphub/web start > web.log 2>&1 &
          npx --yes wait-on http://localhost:4000/api/v1/health/ready http://localhost:3000/en --timeout 120000
      - run: pnpm --filter @triphub/e2e e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-artifacts
          path: |
            apps/e2e/test-results
            api.log
            web.log
